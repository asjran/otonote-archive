# Examples only. The management server is distinct from the public website.
# Replace proxy identity/secrets through restricted deployment configuration.
server {
    listen 127.0.0.1:18080;
    server_name 127.0.0.1;
    access_log off;

    location = /_auth {
        internal;
        proxy_pass http://127.0.0.1:4180/oauth2/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URL http://127.0.0.1:18080$request_uri;
    }
    location /oauth2/ {
        proxy_pass http://127.0.0.1:4180;
        proxy_set_header Host 127.0.0.1:18080;
        proxy_set_header X-Auth-Request-Redirect http://127.0.0.1:18080/;
    }
    location / {
        auth_request /_auth;
        error_page 401 = /oauth2/sign_in;
        auth_request_set $admin_email $upstream_http_x_auth_request_email;
        proxy_set_header X-Admin-User $admin_email;
        proxy_set_header X-Admin-Proxy __ADMIN_PROXY_TOKEN__;
        proxy_set_header Host 127.0.0.1:18080;
        proxy_pass http://127.0.0.1:18084;
    }
}

server {
    listen 127.0.0.1:18083;
    server_name localhost;
    access_log off;
    location = /status { stub_status; }
    location / { return 404; }
}

