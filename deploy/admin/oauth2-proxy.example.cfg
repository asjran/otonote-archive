# Configure your existing OIDC provider; require MFA there.
# Secrets come from protected OAUTH2_PROXY_CLIENT_SECRET and
# OAUTH2_PROXY_COOKIE_SECRET environment variables, not this file.
provider = "oidc"
oidc_issuer_url = "https://identity.example.com"
client_id = "ournotes-admin"
http_address = "127.0.0.1:4180"
redirect_url = "http://127.0.0.1:18080/oauth2/callback"
upstreams = ["static://202"]
set_xauthrequest = true
reverse_proxy = true
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
email_domains = ["example.com"]
# The admin app additionally checks its exact user allowlist.
# Verify loopback Secure-cookie support. If unavailable use a trusted HTTPS
# loopback entrance and matching callback/origin; do not disable cookie_secure.
