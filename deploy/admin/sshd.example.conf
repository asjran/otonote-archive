# Apply only after creating dedicated accounts/keys; do not alter existing admin users.
# Validate with sshd -t and sshd -T -C user=ournotes-tunnel,... before reloading.
Match User ournotes-tunnel
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AllowTcpForwarding local
    PermitOpen 127.0.0.1:18080
    MaxSessions 0
    PermitTTY no
    AllowAgentForwarding no
    X11Forwarding no
    AllowStreamLocalForwarding no
    PermitTunnel no
    PermitUserRC no
    GatewayPorts no

# Machine-specific keys/accounts use their own Match blocks and only their
# required destination: statistics 18081 OR resource API 18082, never '*'.
Match all
