Host resource-api
    HostName resource.example.com
    User ournotes-node-tunnel
    Port 22
    IdentityFile /etc/ournotes-admin/keys/resource-api
    UserKnownHostsFile /etc/ournotes-admin/known_hosts
    StrictHostKeyChecking yes
    IdentitiesOnly yes
    BatchMode yes
    ExitOnForwardFailure yes
    ServerAliveInterval 15
    ServerAliveCountMax 3
    ForwardAgent no
    RequestTTY no
    LocalForward 127.0.0.1:18082 127.0.0.1:18082
